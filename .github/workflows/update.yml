name: Synchronize integration catalog

on:
  schedule:
    - cron: '17 * * * *' # Every hour at minute 17 (UTC).
  workflow_dispatch:
  repository_dispatch:
    types: [update-integrations] # Sent by the integration repositories after a release.
  push:
    branches: [main]
    paths: ['.github/workflows/update.yml']

permissions:
  contents: read

concurrency:
  group: synchronize-integration-catalog
  cancel-in-progress: false # Serialize writes; never cancel a running synchronization.

jobs:
  synchronize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false # The catalog script initializes and verifies each source itself.
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: 034e799c7ddb5b911b44f4441716e535b290b299
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/catalog
        with:
          kind: integrations
          token: ${{ github.token }}
          hub-token: ${{ secrets.ORCHESTRATION_PAT }}
