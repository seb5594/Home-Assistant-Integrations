name: Synchronize integration catalog

on:
  schedule:
    - cron: '17 * * * *' # Every hour at minute 17 (UTC).
  workflow_dispatch:
  repository_dispatch:
    types: [update-integrations] # Sent by the integration repositories after a release.
  push:
    branches: [main]
    paths: ['.github/workflows/update.yml', 'scripts/sync_catalog.py', 'templates/README.md']

permissions:
  actions: read
  contents: read

concurrency:
  group: synchronize-integration-catalog
  cancel-in-progress: false # Serialize writes; never cancel a running synchronization.

jobs:
  synchronize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false # Release commits and uploaded packages are inspected directly.
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Refresh sources, metadata, checksums and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_catalog.py
      - name: Verify release catalog
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit changed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitmodules .github/catalog.json catalog-feed.json README.md assets/brands custom_components/seb5594_integration_catalog/catalog.json custom_components/seb5594_integration_catalog/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: synchronize latest integration releases'
            git push
          fi
