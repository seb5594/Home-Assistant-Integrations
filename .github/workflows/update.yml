name: Synchronize integration catalog

on:
  schedule:
    - cron: '17 * * * *' # Every hour at minute 17 (UTC).
  workflow_dispatch:
  repository_dispatch:
    types: [update-integrations] # Sent by the integration repositories after a release.
  push:
    branches: [main]
    paths: ['.github/workflows/update.yml', 'scripts/sync_catalog.py', 'templates/README.md']

permissions:
  actions: read
  contents: read

concurrency:
  group: synchronize-integration-catalog
  cancel-in-progress: false # Serialize writes; never cancel a running synchronization.

jobs:
  synchronize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: false # Release commits and uploaded packages are inspected directly.
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: seb5594/hass-workflows
          ref: a053c08d5f27a86a97aa6014b1a36b0f3fdd42cf
          token: ${{ secrets.ORCHESTRATION_PAT }}
          path: .engine
          persist-credentials: false
      - uses: ./.engine/.actions/catalog-sync
        with:
          token: ${{ github.token }}
