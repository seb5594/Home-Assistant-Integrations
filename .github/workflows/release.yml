name: Publish hub release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/integration_catalog/**'
      - 'hacs.json'
      - 'scripts/build_release.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  # Catalog commits use GITHUB_TOKEN, which does not trigger another push workflow.
  workflow_run:
    workflows: ['Synchronize integration catalog']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-integration-hub-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Check whether this hub version is already released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c 'import json; print(json.load(open("custom_components/integration_catalog/manifest.json"))["version"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.release.outputs.exists == 'false'
        with:
          python-version: '3.14'
      - name: Validate before publishing
        if: steps.release.outputs.exists == 'false'
        run: |
          pip install ruff pytest-homeassistant-custom-component==0.13.375
          ruff check .
          python -m unittest discover -s tests -p 'test_*.py'
          python -m pytest -q tests_ha
      - name: Build HACS package
        if: steps.release.outputs.exists == 'false'
        run: python scripts/build_release.py
      - name: Publish tagged release and uploaded package
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          gh release create "$RELEASE_TAG" dist/integration_catalog.zip dist/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" --title "seb5594's Integration Hub $RELEASE_TAG" --generate-notes
